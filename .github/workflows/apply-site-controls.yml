name: Apply site controls

on:
  push:
    paths:
      - '.github/workflows/apply-site-controls.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update page headers
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = list(Path('.').glob('*.html')) + list(Path('posts').glob('*.html'))

          for path in pages:
              text = path.read_text(encoding='utf-8')
              prefix = '../' if path.parent.name == 'posts' else ''

              if 'theme.js' not in text:
                  text = re.sub(
                      r'\s*<link rel="stylesheet" href="(?:\.\./)?styles\.css(?:\?v=\d+)?">',
                      f'\n  <script src="{prefix}theme.js"></script>\n  <link rel="stylesheet" href="{prefix}styles.css?v=9">',
                      text,
                      count=1,
                  )
              else:
                  text = re.sub(
                      r'href="(?:\.\./)?styles\.css(?:\?v=\d+)?"',
                      f'href="{prefix}styles.css?v=9"',
                      text,
                      count=1,
                  )

              cv_href = f'{prefix}cv.html'
              current = ' aria-current="page"' if path.name == 'cv.html' else ''
              nav = (
                  '<nav aria-label="Primary navigation">\n'
                  f'        <a class="nav-link" href="{cv_href}"{current}>cv</a>\n'
                  '        <button class="theme-toggle" type="button" data-theme-toggle>turn the lights off</button>\n'
                  '      </nav>'
              )

              if re.search(r'<nav(?:\s+aria-label="Primary navigation")?>.*?</nav>', text, re.S):
                  text = re.sub(
                      r'<nav(?:\s+aria-label="Primary navigation")?>.*?</nav>',
                      nav,
                      text,
                      count=1,
                      flags=re.S,
                  )
              else:
                  text = re.sub(
                      r'(<a class="brand"[^>]*>.*?</a>)',
                      r'\1\n      ' + nav,
                      text,
                      count=1,
                      flags=re.S,
                  )

              text = re.sub(
                  r'(<a class="brand"[^>]*>)maximus<span class="muted">://security</span>(</a>)',
                  r'\1maximus\2',
                  text,
                  count=1,
              )

              if path.name == 'cv.html':
                  text = re.sub(
                      r'<p class="cv-contact">.*?</p>',
                      '<p class="cv-contact">Bristol, UK <span>|</span> <a href="mailto:Maximusgreen425@gmail.com">Maximusgreen425@gmail.com</a></p>',
                      text,
                      count=1,
                      flags=re.S,
                  )

              path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "snorlax"
          git config user.email "maximusgreen425@gmail.com"
          git add '*.html' 'posts/*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add nav theme toggle and restore CV email"
          git push
